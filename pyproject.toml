[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "everypixel-cli"
dynamic = ["version"]
description = "Official command line interface for Everypixel API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Everypixel Labs" }]
keywords = ["everypixel", "cli", "api", "image", "video", "automation"]
dependencies = [
    "anyio>=4,<5",
    "click>=8.1,<9",
    "httpx>=0.27",
    "jsonschema>=4.23,<5",
    "keyring>=25.0",
    "mcp>=2,<3",
    "platformdirs>=4.2",
    "pydantic>=2.8",
    "referencing>=0.35",
    "rich>=13.7",
    "typer>=0.12",
]

[project.urls]
Homepage = "https://labs.everypixel.com"
Repository = "https://github.com/everypixel/everypixel-cli"
Issues = "https://github.com/everypixel/everypixel-cli/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.12",
    "tomli>=2; python_version < '3.11'",
    "types-jsonschema>=4.23",
]

[project.scripts]
everypixel = "everypixel_cli.cli:app"
epx = "everypixel_cli.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/everypixel_cli"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "CHANGELOG.md"]

[tool.hatch.version]
path = "src/everypixel_cli/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "SIM", "C4", "ARG", "RET", "S"]

[tool.ruff.lint.per-file-ignores]
"src/everypixel_cli/cli.py" = ["B006"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
check_untyped_defs = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["everypixel_cli"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
